name: Device documentation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  porting-record:
    # The board selects components only our fork's catalog has (Sm7635Platform, QcomPmicRtc), so the record is checked
    # with the fork's tools; UniXNU main's catalog reports them unknown.
    uses: rootstockos/UniXNU/.github/workflows/porting-record.yml@asteroids-dev
    with:
      tools_repository: rootstockos/UniXNU
      tools_ref: asteroids-dev
