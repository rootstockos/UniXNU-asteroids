# Board description of the Nothing Phone (3a) (asteroids, SM7635 "volcano"), read by the unixnu build driver (device format 2).
# Hardware facts and how they were measured: docs/asteroids-hw-facts.md in rootstockos/iosonandng.
schema_version = 2

# The SoC profile (rootstockos/UniXNU-sm7635-common, pinned in feeds.toml) supplies the CPUs, GIC, UFS and GPU resources; the OS
# profile supplies the unchanged iPad7,1 iPadOS 17.7.11 (21H461) restore image, its prelink, text fixups, trust-cache pins and the
# iPad identity of the ADT, the same values this file carried in format 1.
[board]
name = "asteroids"
soc = "SM7635"
soc_source = "sm7635"
os_profile = "ipados-17.7.11-21H461"
description = "Nothing Phone (3a)"
kit = "asteroids"

# Components from UniXNU's catalog. Four are this repository's own submodules at their catalog paths, which take precedence over
# UniXNU's: drivers/Adreno740 (rootstockos/NativeAdreno asteroids-a810, the gen8 fork; its GPU code is compiled into the display
# archive), drivers/ShengUfs (rootstockos/NativeUfs fix/unverified-build), drivers/ShengHidInput and kits/AdrenoFirmware
# (rootstockos/AdrenoFirmware asteroids-a8xx). Dependencies (Sm8550Platform, VirtioMmioBlock, VerifiedRoot, ShengNovatekTouch)
# are linked into the tree and not built. Sm7635Platform is the SoC profile's GMU kit (UniXNU-sm7635-common).
# drivers/ArmDTPlatform is a plain copy of UniXNU/ArmDTPlatform 417ff95 plus the wall-clock forwarding to IORTC (T39), until it
# has a fork repository; QcomPmicRtc is in-tree in rootstockos/UniXNU t36 (drivers/QcomPmicRtc).
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "RamBlock", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState",
           "QcomGeniSpi", "AdrenoPM4", "ArmSmmu4K", "AdrenoFirmware", "Adreno740", "ShengUfs", "ShengHidInput",
           "Sm7635Platform", "QcomPmicRtc"]

# The hardware description: dts/asteroids.dts on the SoC's dts/sm7635.dtsi. The common ADT generator builds the ADT from it.
[device_tree]
source = "device:dts/asteroids.dts"
include_dirs = ["soc:dts"]

# The userdata partition (LUN 0, sda13), read by NativeUfs's read-only probe (native-ufs-probe=10) on 2026-10-23:
# first 0x256248, last 0x3a8bffa in 4 KiB blocks = 58940851 blocks (224.84 GiB); the ext4 file system there had exactly
# that block count. The root image goes here and replaces Ubuntu Touch's data.
[userdata]
first_lba = 0x256248
last_lba = 0x3a8bffa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "asteroids_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7635.config", "os:configs/ipados.config"]
# The device series lists the fork's bring-up patches (format 1 took every patches/xnu file) and the board's CPU patches.
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Archive builders of the kernel step, in order. Each entry is a script of scripts/ in the build tree, without the
# "scripts/" prefix (kernel.py prepends it; the "scripts/..." form in docs/porting/device-repository.md would resolve
# to scripts/scripts/...). Exactly the archives the proposed defconfig links, nothing more.
archives = [
  # Kept: XNU_SOURCE_CORECRYPTO14 links build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a; the plain
  # build comes first, the namespaced one is made from it. ArmCpu requires the source provider.
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  # Kept: the platform expert (XNU_ARM_DT_PLATFORM) the first boot is meant to reach. Board-independent: it reads
  # /cpus, /arm-io, /defaults, /options and the /chosen NVRAM proxy from the ADT.
  "component:ArmDTPlatform",
  # T39: the PMK8550 RTC behind the SPMI arbiter (CONFIG_XNU_QCOM_PMIC_RTC), published as IORTC for the platform expert.
  "component:QcomPmicRtc",
  # Kept: the CPU, GICv3 and timer provider (XNU_ARMCPU). The GIC layout (dist 0x17100000, redist 0x17180000, stride
  # 0x40000) and 19.2 MHz timer are sheng's, taken from the ADT. Secondaries stay off without sheng-smp=1.
  "component:ArmCpu",
  # Restored after the first boot: XNU registers pthread at early boot (panic "pthread kernel extension not loaded"
  # at pthread_shims.c:318 without it). XNU_SOURCE_PTHREAD links this archive.
  "build-libpthread-kernel.py",
  # Restored after the second boot: the unchanged AMFI panics "AMFI: No PMGR?" (ConfigurationSettings.cpp:235) on
  # every boot, not only with a UFS root. sheng's provider (package/ShengPlatformPower.cpp, unchanged) touches no
  # hardware; it only publishes an ApplePMGR whose power operations stop with a panic. Our copy of sheng's build
  # script pins two values so it builds in a fresh tree. XNU_SHENG_PMGR links it; sheng-pmgr=2 runs it.
  "build-asteroids-platform-power.py",
  # UFS, step 1: NativeUfs for its read-only probe (native-ufs-probe=10: GPT, userdata, first block). Its hardware
  # facts hold on SM7635: host 0x1d84000, apps SMMU 0x15000000 with UFS stream 0x60, and the GCC UFS GDSCs (0x77004,
  # 0x9e000) and branches (0x77018...0x770e4) are at SM8550's offsets (gcc-volcano.c, the 3a's live DT). Built
  # without the verified-root check (scripts/build-arm-driver.py), which needs signed volume policies not built yet.
  # drivers/NativeUfs is our fork (rootstockos/NativeUfs, fix/unverified-build): upstream did not build that way.
  "component:ShengUfs",
  # NativeUfsBlock's IOBlockStorageDevice imports, bound to the original class in the prelinked bootstrap candidate
  # (uke's binder; CI makes the candidate with scripts/ci-bootstrap-candidate.sh as pre_build).
  "build-ufs-original-bindings.py --candidate build/xnu-prelink/bootstrap-candidate.macho",
  # UFS root, step 2, as on uke: the Data volume (NativeRamBlock, which needs NativeAES; UniXNU binds NativeAES from
  # its recorded original addresses, scripts/data/native-aes-original-bindings.S) and the mockfs fixture.
  # NativeRamBlock's IOBlockStorageDevice imports resolve against NativeUfs's bindings.
  "component:SoftwareAES",
  "build-native-aes-bindings.py",
  "component:RamBlock",
  "build-mockfs-fixture.py",
  # T25: the boot progress kit (sheng's diagnostics, package/Boot*.c): the live page, user fault evidence, the UI trace of the
  # boot-ui-focus processes, and our launchd watchdog policy (uke's BootWatchdogPolicy.c, formerly build-watchdog-policy.py:
  # watchdogd off, sheng-disable-jobs, the Gunyah watchdog pet every 5 s).
  "build-boot-progress.py",
  # Display, CPU-rendered (T24b): UniXNU's display recipe (docs/porting/display.md). UniXNU-sheng 0e1f6e5's
  # build-gop-legacy-display.py and LegacyDisplayProbe.cpp (here scripts/build-native-legacy-display.py and
  # package/LegacyDisplayProbe.cpp), with the core's GopFramebuffer cf3b429 (drivers/GopFramebuffer; this repository no
  # longer carries its own copy) and our HidInputProbe.cpp, KeyStoreProbe.cpp, TouchState.cpp and LegacyDisplayStubs.c.
  # It binds NativeLegacyDisplay to the original IOMobileFramebufferLegacy.
  # T30: the GPU objects are back (T20's GpuPowerProbe.cpp, NativeAdreno's staged classes and the AGXAccelerator, the GMU
  # vote and cold-start kits). GPU power mode 6 parses the command DB with the device package's vote builder; its headers
  # come from scripts/data/a810-gmu-votes.json (derived locally from the phone's DT, which is not committed).
  "prepare-asteroids-gmu-votes.py --from-data",
  # The GMU cold start's generated registers and the pinned firmware as a C array (modes 9-10); reads the device repo's
  # .cache, which the CI bootstrap fills (extract-files.py, prepare-asteroids-gmu.py --fetch).
  "prepare-asteroids-gmu.py",
  # Format 2: every selected component with a kernel recipe needs an entry. AppleKeyStoreState and ShengHidInput build archives the
  # display archive also compiles from the same sources (harmless); Adreno740 skips itself with XNU_NATIVE_ADRENO off
  # (scripts/build-arm-driver.py), its GPU code being in the display archive.
  "component:AppleKeyStoreState",
  "component:Adreno740",
  "component:ShengHidInput",
  "build-native-legacy-display.py",
  # Dropped: "build-arm-driver.py NativeAES" and "build-native-aes-bindings.py". NativeAES is only needed by the
  # storage drivers (NativeVirtioBlock, NativeRamBlock); uke's first-console config reached the XNU entry without it.
  # Dropped: "build-arm-driver.py NativeVirtioBlock", "build-arm-driver.py NativeRamBlock" and both
  # "build-native-virtio-bindings.py" entries. There is no VirtIO device, and the RAM block only serves a Data seed.
  # Dropped: "build-mockfs-fixture.py". mockfs is the offline executable-root test fixture; no root this boot.
  # Dropped: "build-boot-progress.py". It compiles kits/sheng/BootProgress.c (the sheng package) with a uefi-sheng
  # include path, and XNU_BOOT_PROGRESS also needs UFS, the owner-root audit and VirtIO. See the open questions.
  # Dropped: "build-arm-driver.py NativeAdreno", "build-native-adreno-kits.py", "build-native-adreno-accelerator.py".
  # Adreno 740 only; the asteroids GPU is Adreno 8xx (gen8_3_0).
  # Dropped: "build-native-legacy-display.py". The CPU-rendered display for SpringBoard (sheng device script). XNU's
  # own video console draws -v text on the GOP framebuffer that DarwinBoot hands over without it, and fajita notes that
  # the legacy display and -v exclude each other (with -v DarwinBoot clears v_display).
]

# The payload: a FAT volume with the UniXNU config, the kernel and its ADT. DarwinBoot is in the firmware
# volume. Build with "unixnu build payload --uefi ../uefi-asteroids": the panic screen takes its font from the Mu-Silicium
# checkout (Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib).
[payload]
volume = "ASTEROIDESP"                # 11 characters, the FAT label limit; the label itself is not matched by anything
size_mib = 80                         # sheng's 192 held the verified bundles and the Data seed; this kernel's files took
                                      # 49 MiB, and 62 with T18's published GPU addon (64 was too small). payload.py refuses the
                                      # build if the files exceed 95 %, so raise it if that happens. It rides in the kernel
                                      # image (see [bootimg]), so smaller loads faster
loader = "firmware"                   # kept: DarwinBoot is already in the asteroids firmware volume
title = "asteroids: iPadOS from UFS"
timeout = 3                           # kept at the default; the menu already works on the phone
dram_size = "0x1FFE00000"             # T19: /chosen/dram-size from make-asteroids-adt.py's DRAM_BASE 0x8C0000000, the high bank
                                      # up to the GPU pool (0x8C0000000-0xABFE00000), where the XNU window now lives (uke's layout;
                                      # sheng keeps 0x80000000 + 2 GiB here with a high window, which also boots)
panic_screen = true                   # kept: patches a copy of the kernel with the entry bars (blue at entry, magenta before
                                      # the MMU) and panic() drawn on the framebuffer; the only way to read a panic without UART.
                                      # Board-independent (symbols from the kernel, 19.2 MHz timebase), needs the two scripts above

kernel_args = [
  "-v",                               # kept: verbose text console on the framebuffer
  "-enable_kprintf_spam",             # from uke: DEVELOPMENT kernels keep kprintf off without it; with no UART it goes to
                                      # the video console, so kernel diagnostics show on screen
  "-textconsole",                     # our UniXNU fork (uke's -uketextconsole): text console with the framebuffer mapped;
                                      # also prints the previous boot's panic log
  "serial=3",                         # kept: serial console and kprintf on; no UART, so output stays on the video console (as on sheng)
  "debug=0x14e",                      # kept: debug mask with kprintf (DB_KPRT) and panic detail
  "kt_fixed_zones=120",               # kept: generic XNU zone sizing that sheng, fajita and uke all boot with
  "-no_slto_panic",                   # kept: generic, avoids the SLTO panic on this non-Apple CPU
  "ml-timeout-lock-panic-scale=40",   # kept: generic; a slow 4 KiB-page bring-up with diagnostics trips lock timeouts
  "armcpu-diagnostics=1",             # kept: generic ArmCpu, prints the CPU and GIC state; first check if interrupts fail
  "sheng-pmgr=2",                     # kept: also the code default, but UniXNU's payload check requires it here for the UFS root
  # UFS root, step 2, after uke's working set (Allenwdk/UniXNU-uke board.toml) without its display and input:
  "native-ufs-root=1",                # NativeUfs publishes the OS and SystemOS windows of the userdata root image
  "native-ufs-allow-unverified=1",    # without the owner policy bundle (our NativeUfs fork); reads are not authenticated
  "offline-apfs-load=1",              # load APFS (and IOStorageFamily) so the windows' volumes appear
  "-apfs_shared_datavolume",          # as uke and sheng: the Data volume is shared with the root's volume group
  "sheng-data-persist=2",             # Data writes go through to the store at the end of userdata
  "sheng-log=1",                      # persistent kernel log at the end of userdata
  # T23, as umi (an iPadOS 17.7.11 phone at Hello with a CPU display): only the four jobs of the XPC wait cycle are
  # left out, not sheng-lite's list of about 25.
  "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd,com.apple.coreduetd",  # T35: coreduetd as on sheng (d4c299b): one thread above 50 % of a core for the whole boot
  # The read-only probe (native-ufs-probe=10) found userdata at 0x256248-0x3a8bffa; see [userdata].
  # Display, CPU-rendered, as uke boots it: load IOMobileGraphicsFamily, register NativeLegacyDisplay on the GOP
  # framebuffer as the default surface, and present frames drawn by the CPU. offline-hid-* and offline-key-events publish
  # the HID and key event services SpringBoard waits for (no touch hardware behind them yet).
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=0",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # T23: umi and sheng run without uke's offline-legacy-default-surface=1, offline-legacy-base-present=1 and
  # offline-legacy-noconsole=1; all three are off.
  "offline-legacy-phase=4",
  # T24b: the refresh policy step of docs/porting/display.md. GopFramebuffer reports this rate through slot 301 and
  # publishes IOMFBDisplayRefresh before registerService; the render server paces its display timer by it. 120 Hz is the
  # 3a panel's rated mode, not a measured one (there is no DPU timing probe for the SM7635 yet).
  "sheng-vsync=120",
  # T25: the boot progress kit's live page and UI trace (docs/guide/debugging.md of UniXNU). The trace samples the render
  # server's process, SpringBoard, and the two that decide launches and kills; one page every 8 s.
  # T25b: T25 found all four idle and liveactivitiesd in a Swift trap loop, and the last display client was pid 71
  # (PerfPowerServices on T24b's console). Slot 1 takes PerfPowerServices and slot 3 liveactivitiesd; backboardd moves to
  # slot 4. boot-ui-follow=1 traces whatever SpringBoard sends to in slot 4 (and that process's own peer in slot 1); while
  # SpringBoard only receives, both slots keep their names.
  # T26: the page shows every display client (pid, selectors with calls/fails) on the HANDOFF and CLIENT rows.
  # T27: boot-display-page=1 gives rows 6..20 to the display log: every open, client, call in order (argument shape and
  # status), the state words and the display's property keys, paged every 6 s.
  # T28: the display log adds each call's caller stack (k<n>), the state words a call or the time between calls changed, and
  # every distinct main-thread stack of backboardd the trace samples (slot 4, so boot-ui-follow is off: it would move slot 4 off
  # backboardd). t28-power-ack=1 answers a refused power-on (selector 12) with success while the powered word says on;
  # T28b is the same kernel with t28-power-ack=0.
  # T29: AppleKeyStore stand-in published on the persistent Data disk (package/KeyStoreProbe.cpp); T28 logging unchanged.
  # T30: T29 with the GPU (sheng-gpu-power=19 and the published Metal addon, below). t28-power-ack is off by default.
  "sheng-build-tag=T39",
  "sheng-cpufreq=4",                  # T35: sheng's CPU governor (touch boost, frame floor); T35b/T36a ran it stable
  "sheng-buttons=1",                  # T35: power and volume through the PMIC interrupt; T36a: work in iOS
  "asteroids-panel=3",                # T37: iOS brightness and panel sleep over DSI0 DCS commands; T37d: works
  "boot-ui-focus4=backboardd",
  # GPU power observation (package/GpuPowerProbe.cpp), one stage per test boot: 1 reads the GCC GPU branches, then GPUCC,
  # SMMU and RBBM only where the previous block shows its clock or power on, and logs each block before touching it
  # ("ASTEROIDS GPU: ..."). 2 adds the one write Linux makes (gcc_gpu_cfg_ahb_clk), 3 powers CX and the SMMU clocks, 4 tests
  # the GMU pool, 5 builds the GMU's SMMU context on it (NativeAdrenoGmuContextBringup), 6 reads the GMU clock tree and the
  # command DB and builds the HFI table (no writes), 7 brings up the GMU clocks (GPLL0 vote, PLL0, hub and gmu RCGs,
  # gpu_cc_ahb) with the GMU still in reset, 8 then reads the GMU and RSCC state the cold start checks (no writes),
  # 9 loads gen80300_gmu.bin and releases the GMU to HFI ready, 10 also sends the HFI startup messages, 11 then votes
  # the lowest GPU level over HFI, asks the GMU for GX (OOB GPU_SET) and reads RBBM once GX is on, 12 then reads the SW
  # fuse and CP state, builds the GPU's SMMU context (bank 0, SID 0, ACTLR 0x32b) and copies gen80300_sqe.fw into it, 13 runs
  # a8xx hw_init's register writes, 14 starts the CP (ring, SQE, CP_ME_INIT, fenced
  # WPTR writes) and has it write one word, 15 loads the zap shader (PAS 13) and leaves secure mode, 16 runs a first IB
  # and has the GPU write a red/green/blue bar into the framebuffer, redrawn every 200 ms for 2 minutes, 17 adopts the BO
  # pool, attaches fences and the timer, publishes NativeAdreno's user client and runs it from the kernel, 18 draws the bar
  # once, does what 17 does, then prints for ten minutes what user space (the GPU addon's test daemon, sheng-gpu-addon=1)
  # does with the service, 19 also publishes the AGXAccelerator for the original Metal discovery (the addon's Metal plugin
  # then tests in backboardd; T18's published plugin returns a Metal device there instead). With 19, sheng-fb-gpu=1 lets
  # the published plugin copy the display's frames to the scanout with the GPU (drivers/GopFramebuffer/NativeGOPPresenter.cpp);
  # a frame nobody takes keeps the CPU copy.
  # T33: mode 19 is GpuPowerProbe's default; sheng-gpu-power=0 turns it off.
  # T24-T29: no sheng-gpu-power (GpuPowerProbe.cpp was not built).
  # T30: mode 19 with T19's published Metal addon (metal2vulkan on Turnip in backboardd). T19 stopped at "encodes, never
  # commits" while SpringBoard itself never finished booting (T28-T29: the missing AppleKeyStore).
  # T33: these values are now the board package's defaults, so they are no longer passed: sheng-pmgr=2, sheng-aks=1,
  # sheng-disable-watchdogd=1, offline-legacy-unit-scale=2, boot-progress=2, boot-display-page=1, offline-hid-home=1,
  # offline-hid-input=1, offline-key-events=1, sheng-gpu-power=19 and asteroids-touch=6 (pass =0 to turn one off).
  # T33: with mode 19 and the addon the display probe turns the GPU copy to the panel on by itself (sheng-fb-gpu=0 keeps the
  # CPU copy, which took 143-285 ms a frame and showed stale patches), and the on-screen diagnostics are off once the UI runs
  # (sheng-banner=1 brings them back; the rows go to the UFS log either way).
  "sheng-gpu-addon=1",
  # Touch: package/AsteroidsTouchProbe.cpp runs stage 6 by default (asteroids-touch=<n> for another stage, 0 for none) and
  # publishes the FT3683G's contacts to TouchState; UniXNU's NativeHidInput hands them to backboardd only with this argument
  # (read by the core driver, so it stays). The boot-ui-focus rows for PerfPowerServices and SpringBoard were dropped in T32.
  "sheng-touch-hid=1",
  "sheng-fb-gpu=1",                   # kept: UniXNU core's NativeGOPPresenter reads it (default off); without it T34 mixed GPU and CPU copy paths
  # All eight cores, as uke boots: ArmCpu starts the secondaries through PSCI (cpu_regs below lists 0x000-0x700) with
  # sheng-smp=1, and armcpu-spi-ipi=1 is the IPI method uke uses. With one core the CPU-rendered display took minutes
  # without a first frame.
  "sheng-smp=1",
  "armcpu-spi-ipi=1",
  # Dropped: sheng-platform-stage and boot-ui-focus4.
  # Not set: boot-progress=2. Its only reader is kits/sheng/BootProgress.c, which this kernel does not link; the
  # argument would be inert. Add it back together with a ported boot progress kit (see the open questions).
]

[payload.adt]
# The platform identity, as on sheng and uke (same IPSW): /chosen chip-id and unique-chip-id, from which XNU derives IOPlatformUUID.
# Without them gethostuuid() blocks forever and so does timed's XPC handler (T39d: Settings > Date & Time hung).
chip_id = "207"
unique_chip_id = "required"            # the platform seed is not stored in any repository
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of 21H461, as on uke (same IPSW)
packed_data_ramdisk = true             # the Data seed as a packed ramdisk for NativeRamBlock, as on uke
persistent_data = true                 # with sheng-data-persist=2, Data is not ephemeral
# The XNU VM is DarwinBoot's owned_memory_size window (boot_args memSize), not dram_size. T19: 4.75 GiB, uke's and sheng's value on
# the same 12 GB class. The uefi-asteroids memory map declares the high bank 0x8C0000000-0xABFE00000 as conventional memory, so the
# window fits there; 384 MiB left iPadOS short (corpse crashes) and Turnip's heap at 96 MiB, which refused every texture in T18b.
owned_memory_size = "0x130000000"

# The device firmware: our Mu-Silicium port (VolcanoPkg + asteroidsPkg) with UniXNU and DarwinBoot added.
# The 3a's ABL takes the ramdisk from init_boot and ignores the boot image's own: the initrd it passed was the
# vendor_boot ramdisk + init_boot ramdisk + bootconfig (6948396 + 6281595 + 2689 bytes, observed 2026-10-22).
# The payload therefore rides in the kernel image; ShengBootMemoryDxe finds it in the "Kernel" memory region.
[bootimg]
payload_in_kernel = true

# Adreno 810 (gen8), from the phone's device tree and mainline Linux; see docs/asteroids-gpu-gen8.md in
# rootstockos/iosonandng. Not used by the build yet: NativeAdreno (rootstockos/NativeAdreno, asteroids-a810) recognises
# this chip and refuses to start it until its gen8 paths exist. The firmware is in proprietary-files.txt.
[gpu]
model = "Adreno810"
chip_id = "0x44010000"                 # mainline a6xx_catalog.c; the phone's DT has no qcom,chipid, so the ADT must add it
compatible = "qcom,adreno-gpu-gen8-3-0"
family = "ADRENO_8XX_GEN1"
gpu_base = "0x3d00000"                 # kgsl_3d0_reg_memory
gpu_size = "0x40000"
rscc_base = "0x3d50000"
rscc_size = "0x10000"
cx_misc_base = "0x3d9e000"
cx_misc_size = "0x2000"
gmu_base = "0x3d37000"                 # qcom,gen8-gmu: gmu
gmu_size = "0x68000"
gmu_ao_base = "0x3d40000"              # gmu_ao_blk_dec0
gmu_ao_size = "0x10000"
smmu_base = "0x3da0000"                # qcom,kgsl-smmu-v2
sid_user = 0x00                        # context-bank iommus streams in the DT: 0x0, 0x2 and the GMU's 0x5
sid_secure = 0x02
sid_gmu = 0x05
gpucc_base = "0x3d90000"               # qcom,volcano-gpucc
gmem_bytes = "0x90000"                 # 512 KiB + 64 KiB
gmu_chip_id = "0x8030000"
gmu_pool_base = "0xE6440000"            # GMU_Pool in the UEFI memory map (uefi-asteroids 8a92c2c): the first 32 MiB of DXE_Heap1
gmu_pool_bytes = "0x02000000"
# The BO pool (GPU mode 17): RAM above 4 GiB that DarwinBoot never gives XNU (its window is owned_memory_size below 4 GiB),
# so the loader keeps it, as pandora's loader carves its pool. Android's /proc/iomem has 0x8bf800000-0xaffffefff as System
# RAM and the live DT reserves nothing static above 4 GiB. Must match GpuPowerBoard.h GPB_GPU_POOL_*.
gpu_pool_base = "0xABFE00000"             # T19: the top of the high bank, reserved in the UEFI map (GPU_Pool) so the XNU window never covers it
gpu_pool_bytes = "0x40000000"            # 1 GiB since T18b (pandora's size); 128 MiB ran out in T18
preempt_record_bytes = "0x473800"      # 4558 KiB
ubwc_version = 4                       # mainline milos_data, and qcom,ubwc-mode = <4> in the DT
highest_bank_bit = 14                  # LPDDR4X (the DT display node: DDR type 7 -> 14, type 8 -> 15)
zap_region = "gpu_microcode_region@9ea9a000"
# The firmware (gen80300 sqe, gmu and zap) is Qualcomm's and never committed: proprietary-files.txt pins it, and
# scripts/extract-files.py puts it in .cache/firmware from NullDebris's vendor repository at one commit.

[firmware]
config = "asteroids"               # Resources/Configs/asteroids.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Nothing/asteroidsPkg/asteroids.dsc"
fd = "Build/asteroidsPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Nothing",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Nothing",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "asteroids-bringup"

# Board values of the ADT, on top of the OS profile's iPad identity.
[adt.chosen.bytes]
# mount(8) phase 1 (launchd's first boot task) exits with 66 without /chosen/boot-manifest-hash; it names /private/preboot/<hash>
# from it. There is no Apple personalization manifest here, so this is an explicit bring-up boot-set identity, not Apple data:
# uke's value (SHA-384 of "UkeBringup.BootSet.v1\0"), kept for parity with the port that boots past this point.
boot-manifest-hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"

[adt.product.string]
model = "nothing,asteroids"

[adt.product.u32]
thin-bezel = 1

# Suspend/resume is not implemented for this board: the original root-domain policy input instead of a CPU that parks forever.
[adt.defaults.u32]
sleep-disabled = 1

# No 'menu' entry: the 3a has no Home button. home-button-type 2 is the non-mechanical answer BSPlatform passes through.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
