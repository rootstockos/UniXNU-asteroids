# Board description of the Nothing Phone (3a) (asteroids, SM7635 "volcano"), read by the unixnu build driver.
# Hardware facts and how they were measured: docs/asteroids-hw-facts.md in rootstockos/iosonandng.

[board]
name = "asteroids"
soc = "SM7635"
description = "Nothing Phone (3a)"
kit = "asteroids"

# Same target OS image as UniXNU's sheng port: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The userdata partition (LUN 0, sda13), read by NativeUfs's read-only probe (native-ufs-probe=10) on 2026-10-23:
# first 0x256248, last 0x3a8bffa in 4 KiB blocks = 58940851 blocks (224.84 GiB); the ext4 file system there had exactly
# that block count. The root image goes here and replaces Ubuntu Touch's data.
[userdata]
first_lba = 0x256248
last_lba = 0x3a8bffa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "asteroids_defconfig"
# Archive builders of the kernel step, in order. Each entry is a script of scripts/ in the build tree, without the
# "scripts/" prefix (kernel.py prepends it; the "scripts/..." form in docs/porting/device-repository.md would resolve
# to scripts/scripts/...). Exactly the archives the proposed defconfig links, nothing more.
archives = [
  # Kept: XNU_SOURCE_CORECRYPTO14 links build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a; the plain
  # build comes first, the namespaced one is made from it. ArmCpu requires the source provider.
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  # Kept: the platform expert (XNU_ARM_DT_PLATFORM) the first boot is meant to reach. Board-independent: it reads
  # /cpus, /arm-io, /defaults, /options and the /chosen NVRAM proxy from the ADT.
  "build-arm-driver.py ArmDTPlatform",
  # Kept: the CPU, GICv3 and timer provider (XNU_ARMCPU). The GIC layout (dist 0x17100000, redist 0x17180000, stride
  # 0x40000) and 19.2 MHz timer are sheng's, taken from the ADT. Secondaries stay off without sheng-smp=1.
  "build-arm-driver.py ArmCpu",
  # Restored after the first boot: XNU registers pthread at early boot (panic "pthread kernel extension not loaded"
  # at pthread_shims.c:318 without it). XNU_SOURCE_PTHREAD links this archive.
  "build-libpthread-kernel.py",
  # Restored after the second boot: the unchanged AMFI panics "AMFI: No PMGR?" (ConfigurationSettings.cpp:235) on
  # every boot, not only with a UFS root. sheng's provider (package/ShengPlatformPower.cpp, unchanged) touches no
  # hardware; it only publishes an ApplePMGR whose power operations stop with a panic. Our copy of sheng's build
  # script pins two values so it builds in a fresh tree. XNU_SHENG_PMGR links it; sheng-pmgr=2 runs it.
  "build-asteroids-platform-power.py",
  # UFS, step 1: NativeUfs for its read-only probe (native-ufs-probe=10: GPT, userdata, first block). Its hardware
  # facts hold on SM7635: host 0x1d84000, apps SMMU 0x15000000 with UFS stream 0x60, and the GCC UFS GDSCs (0x77004,
  # 0x9e000) and branches (0x77018...0x770e4) are at SM8550's offsets (gcc-volcano.c, the 3a's live DT). Built
  # without the verified-root check (scripts/build-arm-driver.py), which needs signed volume policies not built yet.
  # drivers/NativeUfs is our fork (rootstockos/NativeUfs, fix/unverified-build): upstream did not build that way.
  "build-arm-driver.py NativeUfs",
  # NativeUfsBlock's IOBlockStorageDevice imports, bound to the original class in the prelinked bootstrap candidate
  # (uke's binder; CI makes the candidate with scripts/ci-bootstrap-candidate.sh as pre_build).
  "build-ufs-original-bindings.py --candidate build/native-prelink/bootstrap-candidate.macho",
  # UFS root, step 2, as on uke: the Data volume (NativeRamBlock, which needs NativeAES; UniXNU binds NativeAES from
  # its recorded original addresses, scripts/data/native-aes-original-bindings.S) and the mockfs fixture.
  # NativeRamBlock's IOBlockStorageDevice imports resolve against NativeUfs's bindings.
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-arm-driver.py NativeRamBlock",
  "build-mockfs-fixture.py",
  # UFS root, step 3: the launchd watchdog policy (uke's BootWatchdogPolicy.c): disables watchdogd and, with
  # sheng-lite=1, the daemons that need missing hardware, and pets the Gunyah watchdog every 5 s.
  "build-watchdog-policy.py",
  # Display, CPU-rendered: uke's display build (scripts/build-native-legacy-display.py, without uke's touch, CPU frequency
  # and boot-trace probes) with uke's board probe (package/LegacyDisplayProbe.cpp, HidInputProbe.cpp, KeyStoreProbe.cpp,
  # LegacyDisplayStubs.c). It binds UniXNU's NativeLegacyDisplay to the original IOMobileFramebufferLegacy.
  "build-native-legacy-display.py",
  # Dropped: "build-arm-driver.py NativeAES" and "build-native-aes-bindings.py". NativeAES is only needed by the
  # storage drivers (NativeVirtioBlock, NativeRamBlock); uke's first-console config reached the XNU entry without it.
  # Dropped: "build-arm-driver.py NativeVirtioBlock", "build-arm-driver.py NativeRamBlock" and both
  # "build-native-virtio-bindings.py" entries. There is no VirtIO device, and the RAM block only serves a Data seed.
  # Dropped: "build-mockfs-fixture.py". mockfs is the offline executable-root test fixture; no root this boot.
  # Dropped: "build-boot-progress.py". It compiles kits/sheng/BootProgress.c (the sheng package) with a uefi-sheng
  # include path, and XNU_BOOT_PROGRESS also needs UFS, the owner-root audit and VirtIO. See the open questions.
  # Dropped: "build-arm-driver.py NativeAdreno", "build-native-adreno-kits.py", "build-native-adreno-accelerator.py".
  # Adreno 740 only; the asteroids GPU is Adreno 8xx (gen8_3_0).
  # Dropped: "build-native-legacy-display.py". The CPU-rendered display for SpringBoard (sheng device script). XNU's
  # own video console draws -v text on the GOP framebuffer that DarwinBoot hands over without it, and fajita notes that
  # the legacy display and -v exclude each other (with -v DarwinBoot clears v_display).
]

# All values follow the kernelcache, not the board: the same iPad7,1 21H461 KernelCache as sheng ([ipsw] is identical),
# so the pin, slide and AMFI early initializer stay as they are.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"   # kept: same 21H461 kernelcache
slide = "-0x1000000"                                                                         # kept: tied to the kernel link layout
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"         # kept: AMFI address in that kernelcache
# Kept unchanged: sheng's list. It is the one closure known to prelink with this kernelcache (sheng, fajita and uke all use
# it; fajita reached the root mount with it). None of these kexts is board specific, and their personalities only start
# on matching ADT nodes, which the minimal ADT does not have. Strictly needed for this boot are only corecrypto,
# AMFI (the early initializer), AppleImage4, CoreTrust, AppleMatch, sandbox and their dependencies; trimming the
# graphics, audio and HID families is a later, separate experiment (see the open questions).
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The payload: a FAT volume with the UniXNU config, the kernel and its ADT. DarwinBoot is in the firmware
# volume. Build with "unixnu build payload --uefi ../uefi-asteroids": the panic screen takes its font from the Mu-Silicium
# checkout (Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib).
[payload]
volume = "ASTEROIDESP"                # 11 characters, the FAT label limit; the label itself is not matched by anything
size_mib = 64                         # sheng's 192 held the verified bundles and the Data seed; this kernel's files take
                                      # 49 MiB. payload.py refuses the build if the files exceed 95 %, so raise it if that
                                      # happens. It rides in the kernel image (see [bootimg]), so smaller loads faster
loader = "firmware"                   # kept: DarwinBoot is already in the asteroids firmware volume
title = "asteroids: iPadOS from UFS"
timeout = 3                           # kept at the default; the menu already works on the phone
dram_size = "0x80000000"              # the low DRAM window 0x80000000-0x100000000, as on sheng; the phone's /memory fills
                                      # it (with carve-out holes) and puts the rest of its 12 GB above 0x880000000
panic_screen = true                   # kept: patches a copy of the kernel with the entry bars (blue at entry, magenta before
                                      # the MMU) and panic() drawn on the framebuffer; the only way to read a panic without UART.
                                      # Board-independent (symbols from the kernel, 19.2 MHz timebase), needs the two scripts above
# Kept: the original static and System trust caches of 21H461 (same IPSW). Only checked when --trust-cache is given;
# this boot does not need one, since no user process runs.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# Dropped: skip_setup_tool (edits a Data seed; no Data this boot).
# Dropped: text_fixups (dyld shared cache and BTAudioHALPlugin fixes for sheng's userland; nothing in userland runs).
kernel_args = [
  "-v",                               # kept: verbose text console on the framebuffer
  # Off while the display is tested: -enable_kprintf_spam (kprintf to the video console) and -textconsole (our UniXNU
  # fork, from uke: text console with the framebuffer mapped, previous panic log) draw kernel text into the same
  # framebuffer the display presents into. Put both back to read the boot as text; they reached the display client
  # opens (sid=1) on 2026-10-23.
  "serial=3",                         # kept: serial console and kprintf on; no UART, so output stays on the video console (as on sheng)
  "debug=0x14e",                      # kept: debug mask with kprintf (DB_KPRT) and panic detail
  "kt_fixed_zones=120",               # kept: generic XNU zone sizing that sheng, fajita and uke all boot with
  "-no_slto_panic",                   # kept: generic, avoids the SLTO panic on this non-Apple CPU
  "ml-timeout-lock-panic-scale=40",   # kept: generic; a slow 4 KiB-page bring-up with diagnostics trips lock timeouts
  "armcpu-diagnostics=1",             # kept: generic ArmCpu, prints the CPU and GIC state; first check if interrupts fail
  "sheng-pmgr=2",                     # restored: publish the placeholder ApplePMGR (see build-asteroids-platform-power.py)
  # UFS root, step 2, after uke's working set (Allenwdk/UniXNU-uke board.toml) without its display and input:
  "native-ufs-root=1",                # NativeUfs publishes the OS and SystemOS windows of the userdata root image
  "native-ufs-allow-unverified=1",    # without the owner policy bundle (our NativeUfs fork); reads are not authenticated
  "offline-apfs-load=1",              # load APFS (and IOStorageFamily) so the windows' volumes appear
  "-apfs_shared_datavolume",          # as uke and sheng: the Data volume is shared with the root's volume group
  "sheng-data-persist=2",             # Data writes go through to the store at the end of userdata
  "sheng-log=1",                      # persistent kernel log at the end of userdata
  "sheng-aks=1",                      # AppleKeyStore stand-in, as on uke
  "sheng-lite=1",                     # leave out the daemons that need missing hardware, as on uke
  "sheng-disable-watchdogd=1",        # as on uke
  # The read-only probe (native-ufs-probe=10) found userdata at 0x256248-0x3a8bffa; see [userdata].
  # Display, CPU-rendered, as uke boots it: load IOMobileGraphicsFamily, register NativeLegacyDisplay on the GOP
  # framebuffer as the default surface, and present frames drawn by the CPU. offline-hid-* and offline-key-events publish
  # the HID and key event services SpringBoard waits for (no touch hardware behind them yet).
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=0",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=1",      # uke uses 2 on its 3200-wide panel; 2 would make the 3a's 1080 pixels 540 points
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-default-surface=1",
  "offline-legacy-phase=4",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-key-events=1",
  # Dropped: the other sheng-* arguments (sheng-smp, sheng-platform-stage), armcpu-spi-ipi (SMP only) and boot-ui-focus4.
  # Not set: boot-progress=2. Its only reader is kits/sheng/BootProgress.c, which this kernel does not link; the
  # argument would be inert. Add it back together with a ported boot progress kit (see the open questions).
]

# Fixups of signed text, applied by the kernel after signature validation (UniXNU patches/xnu/native-text-fixup.patch),
# passed as /chosen/text-fixups. sheng's list for this same 21H461 build, as uke uses it verbatim:
# +[AWAttentionAwarenessConfiguration initialize] deadlocks SpringBoard startup against Siri (returns at once instead);
# two constants in dyld_shared_cache_arm64.13; BTAudioHALPlugin's factory returns NULL so audiomxd doesn't hang without
# bluetoothd (sheng-lite).
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-asteroids-adt.py"   # being written; same arguments as make-sheng-adt.py
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # kept: eight cores, MPIDR Affinity1 0x000..0x700 (same as sheng).
                                       # ArmCpu probes only the boot CPU without sheng-smp=1, so the others stay off.
                                       # If boot stalls in CPU topology, try "0" (one core, no /psci)
psci_method = "smc"                    # stated explicitly (sheng relied on the tool default); the phone uses PSCI over smc
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of 21H461, as on uke (same IPSW)
packed_data_ramdisk = true             # the Data seed as a packed ramdisk for NativeRamBlock, as on uke
persistent_data = true                 # with sheng-data-persist=2, Data is not ephemeral
ipad_identity = true                   # the userland is iPadOS (iPad7,1), as on uke
# mount(8) phase 1 (launchd's first boot task) exits with 66 without /chosen/boot-manifest-hash; it names
# /private/preboot/<hash> from it. There is no Apple personalization manifest here, so this is an explicit bring-up
# boot-set identity, not Apple data: uke's value (SHA-384 of "UkeBringup.BootSet.v1\0"), kept for parity with the port
# that boots past this point.
boot_manifest_hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
# Dropped: owned_memory_size (sheng's 4.75 GiB is for userland; without it DarwinBoot takes its default 256 MiB window,
# enough for the kernel and prelinked kexts: uke reached the XNU entry with 0x10000000). See the open questions.
# Dropped: root_match_volume_uuid (no root this boot; without it XNU waits for a root device, which is an acceptable end).
# Dropped: chip_id together with unique_chip_id = "required". They seed IOPlatformUUID, which only userland (configd)
# waits for, and the tool refuses one without the other.
# Dropped: packed_data_ramdisk, persistent_data (no Data seed) and ipad_identity (/product iPad identity and /buttons
# for MobileGestalt; userland only).

# Open questions and values to measure on the phone
#
# 1. dram_size: the size of the contiguous DRAM run that starts at 0x80000000, from the UEFI memory map or the SMEM RAM
#    partition table (sheng's 0x80000000 is its own first bank). Never the 12 GB total: the Qualcomm map has holes and
#    carve-outs above the first bank.
# 2. owned_memory_size: left at DarwinBoot's 256 MiB default. If the kernel runs out of memory before the platform expert,
#    request more (2 MiB-aligned, at most the largest free run in the UEFI memory map; DarwinBoot refuses a window it
#    cannot place, visibly, before the hand-over).
# 3. boot-progress: wanted, but its kit is sheng's package (kits/sheng/BootProgress.c and headers) and XNU_BOOT_PROGRESS
#    requires XNU_NATIVE_UFS, XNU_OWNER_ROOT_AUDIT, XNU_NATIVE_VIRTIO_BLOCK and the supplied verified-root archive. Porting
#    it (as fajita did, with weak stubs for the sheng-only symbols) is a separate step; until then -v plus panic_screen
#    give the visible progress.
# 4. Payload size: whether the asteroids ABL loads a ~67 MiB kernel image (shim, firmware and the 64 MiB payload).
#    A ramdisk is no option: ABL ignores it (see [bootimg]).
# 5. Framebuffer: DarwinBoot passes the GOP mode (1080x2392, 32 bpp). Check that the stride it reports is 4320 bytes;
#    a padded stride would skew the console.
# 6. Roots: whether a trimmed prelink closure (without IOGPUFamily, IOMobileGraphicsFamily, IOSurface, the audio, AV,
#    HDCP, CEC and HID families) still prelinks and boots. Not tried here; the sheng list is the qualified one.
# 7. The ADT tool (scripts/make-asteroids-adt.py, in progress) adds /arm-io/ufshc with "qcom,sm8550-ufshc". With
#    NativeUfs not linked nothing matches it, so it is inert this boot; whether NativeUfs should match SM7635 under
#    that compatible is a question for the UFS stage, together with the SM7635 GCC offsets.

# The device firmware: our Mu-Silicium port (VolcanoPkg + asteroidsPkg) with UniXNU and DarwinBoot added.
# The 3a's ABL takes the ramdisk from init_boot and ignores the boot image's own: the initrd it passed was the
# vendor_boot ramdisk + init_boot ramdisk + bootconfig (6948396 + 6281595 + 2689 bytes, observed 2026-10-22).
# The payload therefore rides in the kernel image; ShengBootMemoryDxe finds it in the "Kernel" memory region.
[bootimg]
payload_in_kernel = true

[firmware]
config = "asteroids"               # Resources/Configs/asteroids.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Nothing/asteroidsPkg/asteroids.dsc"
fd = "Build/asteroidsPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Nothing",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Nothing",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "asteroids-bringup"
