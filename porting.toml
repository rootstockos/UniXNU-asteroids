id = "clock"
status = "device-verified"
components = ["QcomPmicRtc"]
paths = ["drivers/ArmDTPlatform", "drivers/ArmDTPlatform/**"]
inputs = ["The PMK8550's RTC: a read-only seconds counter behind the SPMI arbiter (v7.1, APID 94), described in the SoC's sm7635.dtsi.", "The Data volume for the offset file, as Android's time_daemon keeps it under /data/vendor/time."]
configuration = ["QcomPmicRtc (UniXNU fork) publishes IORTC with IORTCReadOnly; drivers/ArmDTPlatform (rootstockos/ArmDTPlatform asteroids) forwards the calendar to it as counter + offset; the kernel restores /private/var/db/unixnu-rtc-offset before launchd and stores it on every calendar set."]
procedure = ["Boot, set the time in Settings > Date & Time, restart, and compare the clock; the banner's RTC row shows the counter, restores and stores."]
findings = ["T39: the counter reads (plat 3, pmic 5); no set reached the kernel while timed hung.", "T39d/T39e: timed hung in gethostuuid() without a platform UUID; with the platform seed in the ADT it answers, and a time set in Settings survives a restart."]
completion = ["The wall clock is right after every boot without a network."]
limits = ["No automatic time (no network or GNSS time source yet)."]
next_action = ["Propose the IORTC forwarding and the RTC drivers upstream once stable."]

