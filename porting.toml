paths = ["package/Audio*", "package/Asteroids*Audio*", "package/AsteroidsTfa9873.*", "package/*Adsp*", "package/Qcom*", "package/FatVolume.*", "package/ShengQrtr.c", "package/ShengGpr.*", "package/ShengAudio*", "package/GeniI2c.*", "package/tests/audioreach*", "hal/**", "patches/xnu/zzyd-*", "scripts/*tfa*", "scripts/*audio*"]
inputs = ["The audio DSP and its firmware; sheng's ADSP, GLINK, QRTR, GPR and AudioReach stack is the reference.", "The 3a's amplifier settings container (vendor/firmware/tfa98xx.cnt, proprietary-files.txt), turned into build/asteroids-tfa/AsteroidsTfaConfig.h by scripts/prepare-asteroids-tfa.py."]
configuration = ["sheng-audio takes bits (sheng-adsp=2 is required, the default): any nonzero value serves the audio service, 2 plays a 1.5 s 750 Hz test tone at boot, 8 runs the lock sound test.", "sheng-audio-pa moves the DSP period buffer (default 0xe6200000, the splash region's tail); sheng-audio-tone-ms and sheng-audio-atten set the tone.", "asteroids-audio-i2s = interface | data lines << 8 | bits << 16 (default primary MI2S, SD1, 32-bit: the amplifiers take their data on gpio17); asteroids-audio-prm bits (default 3): 1 LPASS core vote, 2 MI2S bit clock request.", "asteroids-mic=<stage> (default 0, with sheng-audio) brings up the WCD9378 microphone path in stages: 1 rails (ldob7, ldob8) and codec reset (gpio162), 2 PRM votes and VA/TX core clocks, 3 LPI SoundWire pins and VA/TX macro clocks, 4 VA SoundWire master (0x33b0000, v1.7) and enumeration, 5 codec init (SCP setup, io_init, SDCA class load), 6 capture path (ports, micbias 1, SmartMIC0 sequencer, TX decimator 0), 7 DSP capture graphs and a 2 s capture test, 8 capture for the plug-in. asteroids-mic-port = sample interval | offset1 << 8 | lane << 16 (default 1 | 1 << 8). asteroids-mic-mux=1 switches the VA macro to its own core clock (0x3420000 = 1) as the vendor clock manager does (default off).", "The GPU addon carries sheng's audio server plug-in as audio/ShengAudio.driver (scripts/build-asteroids-metal-plugin.py builds it with scripts/build-sheng-audio-hal.py unless --no-audio, and adds its CDHash to the owner trust module); patches/xnu/zzyd-board-audio-addon-mount.patch mounts audio/ over /System/Library/Audio/Plug-Ins/HAL."]
procedure = ["Read the [audio] and [amps] rows: stage, DSP status, amplifiers found (amps=3: both), clocks stable (lock=), errors, SMMU result, I2C engine, PRM results (bus= second word), I2C failures.", "Run scripts/check-audioreach-host.py after changing the graph commands."]
findings = ["T38 ports sheng's audio DSP bring-up (AdspProbe.cpp, sheng-adsp=1 survey, 2 start) with the 3a's IPCC (0x405000), carveouts (0x99300000, 0x99280000) and crash-reason partition; the firmware comes from modem_a (LUN 4) through NativeUfs's native_ufs_part_find/read (rootstockos/NativeUfs efa8271, from UniXNU's ShengUfs).", "T41: speakers are two NXP TFA9873 (P 0x34 slot 0, S 0x35 slot 1) on QUPv3 wrapper 1 SE6 (SE13, 0x898000, gpio59/60), reset gpio141/142 (active high), fed by primary MI2S (gpio15-18, function 2) as two 32-bit slots at 48 kHz. The container carries no amplifier firmware (a dummy patch), only bitfield settings.", "T41: the microphone is AMIC1 of a WCD9378 (mixer_paths handset-mic: ADC1, MIC BIAS1 by the card routing, ADC_LP, volume 6) on the VA macro's SoundWire master; the handset mic back end is CODEC_DMA-LPAIF_RXTX-TX-3 as on sheng. The codec register recipe is the July 2026 LKML WCD9378 TX driver (v2, paged SDCA registers, built-in power sequencers); the master is v1.7 (apps command FIFO at 0x31c).", "T41: package/AsteroidsAudioProbe.cpp is sheng's AudioProbe.cpp with the 3a's board steps and the TFA9873 programs (AsteroidsTfa9873.c) in place of the CS35L43's; the speaker device runs 32-bit while the stream stays 16-bit (the playback converter widens it). The amplifiers power up after the graphs start, since they wait for the bit clock. No microphone path.", "T40k (2026-10-27): the speaker path ran end to end (DSP graphs, the service, the plug-in, a 48 kHz stream without gaps; both TFA9873 rev B found, clocks and PLL locked) but was silent: on I2S0 SD0 the amplifiers got the clocks and no data. T40k-spk-sd1 (asteroids-audio-i2s=0x200200) played the boot tone and iOS sound through both speakers: the amplifiers take their data on SD1 (gpio17), the default since T41.", "T41: TFA9873 STATUS0 bits 1, 2 and 4 (DCOCPOK, OTDS, UVDS) are ok flags in NXP's field list, not alarms; [audio] err= counts real alarms only (OCDS, MANALARM, NOCLK, TDMERR or a missing ok flag).", "T41, T41-mux: mic stage 4 fails. The rails are voted, the PRM grants the macro and codec votes and the VA/TX core clocks, the LPI pins and macro clocks are set (VA SWR_CONTROL 1) and the master (v1.7) keeps its settings, but COMP_STATUS never shows the link up, no interrupt fires and no device attaches. With asteroids-mic-mux=1 (the VA clock source switch) the master's registers read back 0, so the switch stays off. T42 adds [mic extra]: the codec reset pin read back, COMP_STATUS over time and, with asteroids-mic-pmic=1, the codec's LDOs from the PMIC.", "T42 (2026-10-28): the codec reset pin read back GPIO_IN_OUT 2 (output high, pad low): gpio162 is a TLMM eGPIO (132-166, recovery's pinmux egpio group) and the probe left EGPIO_ENABLE (bit 12) clear, so the pad was not the TLMM's and the WCD9378 stayed in reset (link 0x40002 throughout, no slave). T43 sets the bit. The amplifier resets (gpio141/142) have the same flaw but are active high, so a pad left low releases them. Recovery's device tree: the codec rails are RPMh ldob7 (rxtx, io; already on for the eUSB2 repeater) and ldob8 (buck, on demand), micbias bobb1; SID 1 0x146 has no APID and 0x147 is not an LDO, so the T42 PMIC read can show nothing.", "T43: with EGPIO_ENABLE the codec reset reads back 3 (pad high), yet the VA master's link stays 0x40002 from 1 ms to the end and no slave attaches: the master itself does not run the bus. Next: its clock (the VA macro's SoundWire clock and the 19.2 MHz VA core clock through the PRM).", "T46 (2026-10-28): the mic rows are the same in T42, T43, T46 and T46-copy: rails voted, PRM grants all four requests, LPI pins function 1, VA SWR_CONTROL 1, reset now high, yet COMP_STATUS 0x40002 from 1 ms to the end (bit 0, the frame generator, never set), interrupt status 0, no slave. Against mainline's qcom_swrm_init (drivers/soundwire/qcom.c) the probe missed the v1.7 step: SWRM_LINK_MANAGER_EE (0x018) = 1 for the CPU, then MCP_BUS_CTRL = CLK_START << EE_CPU (4); it wrote 2, EE 0's clock start. T47 follows mainline's order and values. Recovery's DT has no swrm-hctl or EE property for this master.", "T47-mic7 (2026-10-28): every mic stage ran (st=70): bus up (COMP_STATUS 0x100001), the WCD9378 TX device enumerated as device 1 (id 0x01170223, the DT's wcd9378-tx-slave), the codec set up, the SmartMIC0 sequencer at PS0, TX decimator 0, the DSP's capture graphs; 200 of 200 periods came back. The level was near silence: peak 34 of 32767, mean under 1, 18559 non-zero samples. The vendor's handset-mic path records AMIC1 (ADC1, SWR_MIC0) and AMIC3 (ADC2, SWR_MIC4) at ADC volume 6; the probe takes AMIC1 only. T49: asteroids-mic-capture-s=<s> (up to 30) and a [mic peaks] row with the peak of each second.", "T50: sheng-audio=1 (speakers for iOS, no boot test tone) is a board default.", "T51: the 20-second capture came back complete (2000 of 2000 periods) but silent: peak 33 in the first second, exactly 0 in the next 19. The mic path delivers no codec data."]
completion = ["Playback and capture through the audio server."]
limits = ["The microphone does not work yet: stage 4 (SoundWire enumeration) fails, so the plug-in's input stream stays silent.", "The master's port timing is not taken from the vendor driver (not in the published tree): asteroids-mic-port tunes it."]
next_action = ["Boot T42 with asteroids-mic=4 and asteroids-mic-pmic=1 and read [mic extra]: whether the codec's LDOs are on and its reset is released tells whether stage 4 waits on the codec's power or on the bus."]
