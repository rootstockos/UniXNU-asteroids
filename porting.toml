[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["package/LegacyDisplay*", "package/PanelProbe.cpp", "package/AsteroidsBacklight.cpp", "drivers/NativeMobileDisplay", "package/Boot*", "package/Font.h", "scripts/build-native-legacy-display.py", "scripts/build-boot-progress.py", "scripts/audit-mobile-graphics-default-surface.py"]
inputs = ["The firmware's GOP framebuffer, 1080x2392 x8r8g8b8 at stride 4320, on a 120 Hz video-mode panel."]
configuration = ["offline-legacy-* arguments, sheng-vsync=120, sheng-fb-gpu=1 (the GPU copies each frame to the panel)."]
procedure = ["Boot and watch the banner rows (sheng-banner=1) for swaps per second and copy times."]
findings = ["T37 (2026-10-26): DSI0 is reachable under Gunyah (T37a st=1), the brightness test ran (T37b), and with asteroids-panel=3 iOS sets the brightness and sleep turns the panel off and on again (T37d). It is a board default since then.", "T37: the panel (Visionox RM69220 AMOLED, video mode, DSI0 at 0x0ae94000, dsi-ctrl v2.8) takes DCS commands through the controller's TPG command FIFO, scheduled for the first front-porch line (package/PanelProbe.cpp, asteroids-panel=1..4): brightness 51 hi lo (10..4095), off 28 + 10, on 11 + 29. The iOS brightness service is sheng's AppleARMBacklight.cpp with the DCS write instead of I2C (package/AsteroidsBacklight.cpp); level 0 turns the panel off.", "The CPU copy (143-285 ms a frame) mapped the surfaces cacheable without invalidation and showed stale patches; the GPU copy removes both.", "GopFramebuffer 33e941a's direct scanout needs ShengUfs's display SMMU window (native_ufs_dpu_map); our NativeUfs fork has none, so package/LegacyDisplayStubs.c supplies weak zero stand-ins that keep it off.", "T40c (2026-10-27): BootProgress.c's cpu0_park defaults off (see cpu).", "T40k-T42 (2026-10-27): zero copy on the 3a. NativeUfs sheng-dpu-linux=1 sets the display bank up as Linux does: CBA2R and CBAR written (the apps SMMU is qcom,virt-smmu and the hypervisor attaches the bank on that write), TCR2 with the ASID size and SEP, cached inner-shareable walks with T0SZ 28, TTBR0 with an ASID. The bank then took stage 1 without a fault (T40k), where every earlier setup faulted at level 0, even with blocks lacking the access flag (T40i-af). T41: 1018 direct flips, 4.4 ms mean latch, once startDirect waited for the bank (40 ms); frames showed half drawn (the wallpaper without the app), so T42 flips only once the GPU's completed fence reaches the newest fence submitted at the swap."]
completion = ["The desktop presents through the legacy display with measured frame times."]
limits = ["Under 60 frames per second."]
next_action = ["Measure the frame rate with the CPU governor (T35)."]

