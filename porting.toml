[[area]]
id = "gpu"
status = "implemented"
components = ["Adreno740", "AdrenoFirmware", "AdrenoPM4", "ArmSmmu4K", "Sm7635Platform", "Sm8550Platform"]
paths = ["drivers/Adreno740", "drivers/NativeAdreno", "kits/AdrenoFirmware", "package/Gpu*", "package/ShengGmu*", "package/AsteroidsMetalPlugin.mm", "package/AsteroidsGpuUserTest.cpp", "package/OriginalAcceleratorABI.h", "scripts/*gpu*", "scripts/*gmu*", "scripts/*turnip*", "scripts/*metal*", "scripts/shader_tools.py", "scripts/data/**"]
inputs = ["Adreno 810 (gen8, chip 0x44010000) at 0x3d00000 with GMU, RSCC and SMMU; firmware gen80300 from proprietary-files.txt (scripts/extract-files.py, the pinned NullDebris vendor repository)."]
configuration = ["sheng-gpu-power=19, sheng-gpu-addon=1, sheng-gpu-level=6 (763 MHz); the Metal plugin and Turnip are built on the Mac into the payload addon."]
procedure = ["Build the kernel in CI, the addon with scripts/build-asteroids-metal-plugin.py --published, pack and boot."]
findings = ["NativeAdreno's GMU headers (NativeAdrenoGmuConfig.h, NativeAdrenoGmuPlatform.h) include ShengGmu.h, so the driver compiles also take kits/Sm7635Platform (T36 run 40296339052).", "The gen8 GMU cold start and command-database parser are the SoC kit Sm7635Platform (UniXNU-sm7635-common), as sheng's are Sm8550Platform; the board keeps ShengGmuVotes.c. scripts/check-asteroids-gmu.py passes against the kit.", "The render server composites on the A810 (window server ready in 1.9 s instead of 30.8 s).", "The GPU clock does not limit the frame rate: 1050 MHz was barely faster than 763 MHz.", "T40b (2026-10-27): drivers/Adreno740 is UniXNU Adreno740 main (5c8c145) merged into our gen8 fork (rootstockos/NativeAdreno asteroids 60f16a6): ABI v2 (128 buffers per submission), no full GPU TLB flush per submission, owned and exclusive imports mapped without alias scans. The board's GPU probe keeps its ABI structures and native_adreno_publish signature; it passes no GMU AHB fence status to the ring (the new optional fence_cookie/fence_status), so WPTR writes stay unchecked as before.", "T40c (2026-10-27): sheng's GPU governor is on by default in board.toml (sheng-gpu-dcvs=1) with the 3a's range: floor level 6 (763 MHz, the former fixed level; sheng's floor 3 is 510 MHz here and held every frame in T39b), ceiling level 7 (895 MHz; no GPU thermal throttle yet). Fence waits spin (sheng-gpu-irq=0) as a board default.", "T40d (2026-10-27): IO coherence. Nothing here set native_adreno_io_coherent, so the merged driver cleaned and invalidated every imported page around every submission (T40c log: 18 s and 361 GiB of maintenance for about 3000 submissions). GpuPowerProbe now runs UniXNU-sheng's coherenceProbe (08cde20) before publishing: a kernel page mapped write-back inner-shareable, GPU reads of CPU-dirty lines and CPU reads of GPU writes both proved against DRAM; only then is it on (sheng-gpu-coherent=0 skips it). The driver keeps GPU-written imports non-coherent (myron 5bbeb3b). Turnip's 1 ms waits (pandora 6265e2d) were already fixed upstream (100 ms slices in turnip-darwin-kmd.patch); kern.maxvnodes is 66560 from upstream's iPadOS profile.", "T44: [gpu load] counts the dcvs thread's 16 ms windows with work by busy share (under 25, 50, 85 %, 85 % or more, and those at the ceiling, where the GPU was the limit at the highest level allowed) and the longest fully busy run, to tell a GPU-bound frame from one held up elsewhere.", "T43 (2026-10-28): zero copy still alternated the new frame with the wallpaper alone with the shown swap held (586 held to the next latch, 44 by timeout; held swaps also slowed animations, so the compositor waits on the completion), and no flip ever waited for the GPU. The ring flushes the GPU caches (CACHE_FLUSH7, CACHE_INVALIDATE7) only in the prologue of the next submission, so a finished frame's last passes reach memory late: the GPU copy read them through those caches, the display fetches memory. T45: sheng-gpu-endflush=1 (NativeAdreno) adds CACHE_FLUSH7 and CP_WAIT_FOR_IDLE before each framed fence.", "T45 (first build, 2026-10-28): sheng-gpu-endflush never took effect: this board attaches the ring in package/GpuPowerProbe.cpp (gRing), not in NativeAdreno's service, where the boot argument was read. T45b sets it on gRing.", "T46: the GPU was the limit at times while opening apps: of 1098 windows with work, 117 were 85 % busy or more, 111 of them at the ceiling (level 7), the longest fully busy run 149 ms. T47 reverts the end flush and the published fence in NativeAdreno (cd2bbe5, the ring is 1139088's again) and its setting in GpuPowerProbe.", "T48: GpuPowerProbe exports native_gpu_fences (the ring's submissions and the fence page's completed timestamp) for the display probe.", "T49-gpuwait (2026-10-28): scrolling and app opening keep the GPU at its ceiling. 511 of 1075 waited-on fences stayed pending 8 ms or more (121 for 16-32 ms); per-submission cache maintenance cleaned 65 GiB in 114 s (3.6 s of CPU); clients made 198049 fence waits, 99 % timing out at once. T51 measures it: GPU time per submission from the submit hook (NativeAdreno native_adreno_ring_hook) and the fence interrupt, with GPU idle and queued time; maintenance bytes by kind of buffer; the timeouts clients ask for.", "T51 (first build): the board's declaration of NativeAdreno's ring hook carried weak_import inside an extern \"C\" block, which makes it a definition; it is now a plain declaration, set unconditionally (the driver always provides it).", "T51 (2026-10-28): 1979 frames in 118 s, 48 % 17-25 ms apart, 7 % within 9 ms. Swap to GPU done was 8-12 ms for 1180 frames. Per-submission maintenance cleaned 126 GiB (7.0 s of CPU), nearly all read-only imports (127722 MiB counted): every submission cleaned every client's imports, since the VM is shared. Clients made 573185 zero-timeout fence polls (about 4900 per second); the big cores ran 67 % busy. [gpu time] stayed empty: its fences were only taken from the GPU interrupt, and the board runs sheng-gpu-irq=0. T52: sheng-gpu-own-maint=1 (NativeAdreno per-client maintenance), GPU timing also from the display's flip wait and the governor tick.", "T52 (2026-10-28): GPU time per submission, now measured: mean 13.6 ms at level 7 (n=1035; 371 between 17 and 25 ms), 9.0 ms with the GPU held at level 9 (n=1095), so the time scales with the clock and its bandwidth vote: the GPU does too much work per frame rather than stalling. Per-client maintenance changed nothing (55 MiB per submission): the compositor submits nearly everything and owns the imports it cleans. sheng-gpu-irq=1 cut clients' fence polls from 573185 to 13707. T53: the asteroids Turnip patch (UniXNU patches/mesa/turnip-asteroids-stats.patch) counts each submission's passes, system-memory passes, blits, draws and render area; [gpu work] ties them to GPU time.", "T53 (2026-10-28): with Turnip's counts, 5535 of 7713 render passes (72 %) ran in system memory rather than GMEM, and submissions with such a pass took 7.4 of the 12.3 s of GPU time (60 %); 26153 blits, copies and clears (about 20 per submission); 585 single-pass submissions averaged 8.9 ms of GPU time. The draw count read 0 throughout. T54: the reason for each system-memory pass (tile memory too small, feedback loop, too many tiles without HW binning, autotune and so on) per submission, tied to GPU time; asteroids-tu-debug=<flags> in the boot arguments adds Turnip debug flags (gmem, sysmem) for one boot.", "T54 (first add-on build): Turnip with the reason counts compiled; the plugin failed because setTurnipDebug sat inside the publish-only namespace while one caller is outside it. It now sits before that block.", "T54 (2026-10-28): every system-memory pass was Turnip's autotune choice (586 submissions, 6.6 of 10.8 s of GPU time); nothing forced it. Forcing GMEM (asteroids-tu-debug=gmem) put every pass in GMEM and rendered correctly, but GPU time per submission only went from 11.0 to 10.5 ms (single-pass submissions 11.4 to 9.8 ms): where the passes render is not what costs. The Reduce Transparency test could not run (Settings crashes opening Accessibility: Preferences sig 11 at PC 0). T55: GPU timestamps around each pass, blit, copy, resolve and clear give GPU time per kind (turnip-asteroids-timing.patch, [gpu ops]).", "T55 (2026-10-28): stuck at the Apple logo. Not a GPU hang (47 submissions in 100 s, the GPU idle): the wallpaper poster extensions (AegirPoster, KaleidoscopePoster) asked for Metal 12 times each and AegirPoster aborted (signal 6) on every launch, which no earlier boot showed; [gpu ops] collected 14 command buffers and 41 timing brackets that never ran. T56: the brackets are inert unless TU_DW_TIME is set, which the plugin does only in the render server with asteroids-tu-time=1.", "Correction to T55: AegirPoster aborted 5 times in T49-gpuwait too, which booted normally, so the poster crashes are an older bug and not why T55 stayed at the Apple logo. What T55 changed is the timing brackets in every process, the render server included, which made only 47 submissions in 100 s with 41 brackets never written. T56 (timing off) and T56-time (timing in the render server only) separate the two.", "T55-T56 (2026-10-28): the cause of T55's hang was the timing stamps, not the posters: fence 52, the render server's first frame, never completed (51 written), so every later frame waited and PosterBoard's open was refused once the driver stopped taking clients. T56 (brackets inert) booted normally with 913 submissions. T57: the stamps copy the always-on counter with CP_REG_TO_MEM (as Turnip's autotune does, which runs on every boot here), the end stamp after a wait for idle; asteroids-tu-time=passes times render passes only.", "T57 (2026-10-28): t57-passes hung the same way: fence 55 never completed (54 written), and [gpu ops] showed 10 command buffers whose 10 brackets were never written. Both stamp methods wrote into the command buffer's sub-stream memory, which Turnip allocates GPU read-only unless marked writeable, and the Darwin backend maps it with read-only permission. T58: the slots come from the sub stream's GPU-writable memory (tu_cs_set_writeable around the allocation, as Turnip does for GPU-written clear data).", "T58 (2026-10-28): t58-passes booted (1033 submissions): the stamps work once their slots are GPU-writable, confirming T55 and T57 hung on writes to read-only command memory. GPU time per submission 10.2 ms mean; timed render passes took 8.0 of its 10.6 s: 1692 GMEM passes 7.2 s (4.3 ms each), 4031 system-memory passes 0.8 s (0.2 ms each, the autotune's small ones). Untimed in this mode: 19239 blits and the rest (2.5 s); a pass's start stamp does not wait for idle, so blits still running when the next pass starts count toward that pass. t58-all brackets the blits too.", "T58-all (2026-10-28): with everything bracketed (998 submissions, 10.5 s of GPU time, 9.8 s inside brackets): 1636 GMEM passes 7.2 s (4.4 ms each, unchanged from t58-passes, so no blit time had leaked into them), 4897 system-memory passes 0.9 s (0.19 ms), 20876 copies 1.7 s (0.08 ms), 509 clears and 8 blits negligible, no resolves. GMEM passes are 68 % of GPU time.", "T59: asteroids-tu-time=tiles splits each GMEM pass into stages: begin with binning (to after tu6_tile_render_begin), the first subpass's loads and clears (a stamp in draw_cs under the GMEM render-mode condition), draws and stores per tile, summed on the GPU with CP_MEM_TO_MEM as the occlusion queries accumulate, and the pass's end; with tile counts, tile size, render area, HW binning and attachments loaded and stored. The totals reach NativeAdreno as SetMetadata tagged TILE (native_adreno_tiletime) and the log as [gpu tiles].", "T59 (2026-10-28): t59-tiles booted. 1849 GMEM passes, 8.2 s (the per-tile stamps add about 1 s over T58): begin with binning 0.35 s, loads and clears 1.14 s, draws 4.99 s, stores 1.24 s, between tiles 0.50 s, end 0.01 s. 64 tiles per pass (max 85) of about 33K pixels for about 2.0 MP of render area: the A810's GMEM is 576 KiB (NativeAdreno profile 0x90000), so a full-screen pass is cut into many small bins; HW binning ran in 1499 passes; about one attachment loaded and one stored per pass. Per pixel, these passes ran at about 0.46 MP/ms against about 1 MP/ms for the autotune's system-memory passes (0.22 MP each).", "T59-sysmem (2026-10-28): every pass forced to system memory (asteroids-tu-debug=sysmem): 5900 passes, 7.3 s; 746 submissions, 13.0 ms of GPU time each. GPU time per megapixel of render area was the same as with the autotune's mix (9677 ms / 4593 MP = 2.1 ms/MP; t58-all 10546 / 5017 = 2.1): the large passes cost about 2.1 ms/MP in either mode, so tiling is not what makes them slow; their per-pixel work is.", "T60: [gpu frags] splits timed passes into large (1 MP of render area or more) and small, and takes each pass's draw count and samples passed from the autotune's finished entries (its BANDWIDTH metric), so samples per pixel of render area gives overdraw. The turnip-asteroids-stats draw counter had never been sent (the submit word has no bits left), which is why the draw count read 0. The totals reach NativeAdreno as SetMetadata tagged FRAG (native_adreno_fragstats).", "T60 (2026-10-28): 634 submissions, 13.4 ms of GPU time each. 1319 large passes took 6.2 s (4.7 ms each) for 2.52 MP of render area, the full screen; 2719 small passes took 0.2 s (70 us, 59K px). Measured large passes averaged 99 draws (most 262) and 9.2M samples, an overdraw of 3.6; small ones 5 draws and an overdraw of 2.3. Large-pass time per sample is about 0.5 ns, about 3.5 samples per clock at the 895 MHz ceiling (the draws stage, 61 % of a GMEM pass in T59, makes it about 3.2 Gsamples/s). The large passes are slow because CoreAnimation stacks about 3.6 full-screen layers in roughly 100 draws, each shaded and blended in full; on Apple GPUs hidden-surface removal skips the occluded opaque fragments, on the A810 without a depth buffer nothing does. [gpu dcvs] still prints sheng's MHz labels (220-680) for the 3a's levels.", "T61: a GPU trace so that new measurements need no new build. asteroids-tu-trace=<letters> (AsteroidsMetalPlugin.mm, render server only) sets Turnip's TU_DW_TRACE (UniXNU patches/mesa/turnip-asteroids-timing.patch): binary records in m2v/gpu/trace.bin of every timed pass (GPU start and end, render area, GMEM or system memory, tiles and tile size, HW binning, the attachments' formats, load, store, clear, UBWC and tiling, the draws recorded), every draw (vertex and fragment shader ids from the stages' BLAKE3, blend enable and factors, write mask, depth and stencil state, scissor, count), every shader once (ir3's statistics: instructions, nops, texture and SFU counts, registers, waves, sync stalls) and the autotune's samples passed per pass. Letters: p passes, d draws, b shader binaries (1 = pdb), s each draw's samples passed (an occlusion-query pair around every draw, accumulated over tiles by the GPU, with a wait for idle after each draw, so GPU time in that mode is not representative), t GMEM stages, a blits and copies. The file stops at 56 MiB. scripts/gpu-trace.py reports on it (passes by size with overdraw, large-pass draws by blend state with their samples, the fragment shaders behind them with their statistics, render targets) and dumps CSV tables and shader binaries; its record layouts were checked against the C structs by compiling them (118, 60, 76 and 24 bytes). The Turnip changes compile on Linux against the pinned Mesa with every recorded patch applied (local/mesa-full, kgsl build in local/mesa-check).", "T61 (2026-10-28): the trace works end to end: t61 booted, 7 export rounds, pull-asteroids-log fetched and decoded it (5726 passes, 127601 draws, 71 shaders over 35 s, nothing lost). The Metal bridge records each pass's draws in a secondary command buffer, so draws carry the secondary's serial; gpu-trace.py joins each secondary to the next primary serial, which matches the autotune's draw count for 1567 of 1570 passes. The blend fields are not valid: every draw reads factors 0, 0, 0, because Turnip keeps static blend state in the pipeline and not in the command buffer's dynamic state, where the recorder reads it. Findings, large (full-screen) passes, 7.8 s in all: (1) 252 passes with 200-400 solid fills take 12.9 ms each (11.3 ms in system memory, so not tiling) at an overdraw of 11.8, about 41 % of the time; each fill is a 768-vertex mesh drawn by one of two fragment shaders, vertex color times alpha (9 instructions) or the same plus metal2vulkan's exact 8-bit output rounding (85 instructions: per-channel flags from a constant, scale, rndne, compare, select), about 151 and 65 per pass. 232 passes with 100-200 fills take 4.0 ms at an overdraw of 2.2. (2) 1325 passes with few draws (about 8, overdraw 0.19), mostly with the attachment loaded and stored, take 2.3 ms each in GMEM and 1.7 ms in system memory, about 38 %; 155 with no draws at all take 0.8 ms. The exported screen is the console layer (black under zero-copy scanout), so it does not show the scene. ir3-disasm from the local Mesa build (local/mesa-check, chip ffff44010000) disassembles the trace's shader binaries.", "T61-samples (2026-10-28, asteroids-tu-trace=pdbs): the per-draw sample counters ran without a hang (101786 draws, 37 s; GPU times not representative: a wait for idle after each draw). Large passes drew 9.98 G samples. The 768-vertex solid fills that dominate the draw count are tiny (about 325 pixels each for the 9-instruction one); the pixels go to shaders that end in metal2vulkan's exact 8-bit output rounding (saturate, NaN test, x255, rndne, compare with +-0.5, correct, x1/255, select by per-channel flags from c4), about 50 instructions on top of 5-15 of real work: 31 of 66 fragment shaders, 71 % of the samples and 95 % of the instruction-weighted work. The largest single consumer, 6238666134616236 (interpolated color then the rounding, 82 instructions), drew 4.9 G samples at 1.67 M per draw. Upstream development removed this rounding (70068f7c, 'Leave color writes to the device's own conversion', 2026-10-28); the pinned translator only skips it for drivers it has measured (VkProperty::MetalColorWrites, MoltenVK), with no option to set it. Light passes (fewer than 20 fills): 1199, median coverage 0.19 of the screen, 58 % under a quarter, mostly loading and storing the whole attachment (GMEM 621, system memory 517).", "T61-stages (2026-10-28, asteroids-tu-trace=pdbt; gpu-trace.py now splits large passes by coverage, the autotune's samples over the render area): large GMEM passes drawing under a quarter of the screen (459, about 85 tiles, 20 draws) took 2.7 ms each: loads 0.90, draws 0.45, stores 0.94, between tiles 0.38 ms, so about 80 % is loading and storing the whole attachment around a small change; large system-memory passes at the same coverage (66) took 0.17 ms. At coverage 1-3 GMEM took 4.5 ms (draws 2.9) against 2.3 ms in system memory (8 passes); at 8 or more, 13.7 ms with 12.0 ms of draws. The autotune still chose GMEM for most light passes. Load and store run at about 11.5 GB/s each way (10.3 MB of BGRA8 in 0.9 ms). T62 plan: metal2vulkan updated to development (exact output rounding removed) plus a toggleable Turnip choice of system memory for passes whose history draws little of their area.", "T62 (2026-10-29, built, not booted): metal2vulkan moves to development eeb79340 (UniXNU a49a8dd), where color writes are the device's own conversion (70068f7c) and float maths the device's (4817f3bdf, cdc09276f), removing the exact 8-bit output rounding that T61-samples found in 95 % of the large passes' fragment work. The bridge is rootstockos/AdrenoMetal asteroids (137eeb1, forked from UniXNU/AdrenoMetal): the 16 shared patches and sheng's 21 from feat/ipados27-gpu-parity (which stays on the old pin) were triaged against development; 17 remain (skip draws without a pipeline, two-plane shadow as memory lies, padded framebuffers through a new PaddedRowsPolicy::AliasWrites since development removed padded-row aliasing, priming cache, refuse_rebinds now actually set by the bridge, optional shader cache, sRGB extended-range blend, bitreverse, growing memory blocks, patches without control points, heap texture size, Core Image libraries and two small speedups); the rest (keep final pass, fewer allocations per draw, keep draw commands and lists, map tracker keys, and most of sheng's draw-path patches) are done in development by LiveBind, SpareLiveBinds, ViewportList and KeptRenderPasses. Turnip: asteroids-tu-light=<percent> (TU_DW_LIGHT, render server only) renders a pass in system memory when its history draws less than that share of its area (T61-stages: 2.7 ms in GMEM against 0.17 ms in system memory for passes under a quarter of the screen); trace pass records flag such passes (4), and draws read the pipeline's static blend state. Not covered: the translator's own tests beyond the touched areas, and any device run.", "T62 (2026-10-29), every Metal process on the GPU, as sheng's iPadOS 27 branches do (UniXNU-sheng 9800f8cd): drivers/Adreno740 merges UniXNU/Adreno740 feat/ipados27-gpu-parity (rootstockos/NativeAdreno asteroids ad01b92): no connection cap, growing object, queue and job tables, a BO pool of contiguous chunks, msm hangcheck and restart, and per-process GPU address spaces (own page table and ASID, 4 GiB to 2^ias) switched into the GPU's bank: mode 2 by CP_SMMU_TABLE_UPDATE in the ring, only where the board opened the CP's SMMU aperture and one switch is proved at publication, else mode 1, the CPU writing TTBR0 with the GPU idle. This board keeps mode 1: asteroids-gpu-cp-aperture=1 makes sheng's qcom_scm_set_gpu_smmu_aperture call (off: the CP switch has not run on an A810). Kept from this fork in the merge: the gen8 slice SRAM init before the table switch, the reserved GMU pool (its table pages now on demand), single-stream contexts, per-client maintenance, and the loader-kept BO pool (adoptPool) as an adopted chunk of the chunked pool (write-combined, zeroed with stores, never given back). The merge had refused a nonzero submit reserved word, which carries the asteroids Turnip's counts; that check is gone. The board publishes the context's ias with va_start GpuClientVaStart and grants the accelerator to every process (NativeSandboxGrantProcess \"*\"); the plugin's client list is \"*\". UniXNU 2b79721 takes sheng's Turnip backend for the new ABI (address allocator, BO cache returned under pressure) and ArmSmmu4K 30ec63b. Host tests on Linux (GMU and GPU contexts, the board GMU pool, VM, SMMU memory, GMU memory and map) pass; the kernel, board and Turnip backend only build on CI.", "T62 first kernel build (run 40785590664) failed to link: _native_pmap_user_mappings, which the merged NativeAdrenoMemory::release weak-imports from sheng's XNU patch for a diagnostic count; GpuPowerProbe.cpp now defines a weak stand-in that finds no mapping, as it does for boot_log_export_put. The add-on (run 40785594609) built: metal2vulkan development, the bridge, sheng's Turnip backend and the plugin compile for iOS."]
