[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "RamBlock", "SoftwareAES", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "drivers/NativeUfs", "scripts/build-arm-driver.py", "scripts/build-ufs-original-bindings.py", "scripts/ci-bootstrap-candidate.sh", "scripts/pull-asteroids-data.py"]
inputs = ["UFS host 0x1d84000 and PHY 0x1d80000 (SM8550's windows), apps SMMU stream 0x60; userdata LUN 0 blocks 0x256248-0x3a8bffa."]
configuration = ["native-ufs-root=1 and native-ufs-allow-unverified=1; sheng-data-persist=2 keeps Data at the end of userdata."]
procedure = ["Build the userdata image, write it to userdata from recovery, boot, and pull the Data volume with scripts/pull-asteroids-data.py."]
findings = ["Format 2 builds VirtioMmioBlock as ShengUfs's dependency; build-arm-driver.py skips it while XNU_NATIVE_VIRTIO_BLOCK is off.", "NativeUfs (the ShengUfs fork) is built without the verified-root check until signed volume policies exist.", "Its IOBlockStorageDevice imports bind against the original class in a bootstrap kernel candidate built first in CI."]
completion = ["The root volume mounts read-only from UFS and Data persists across boots."]
limits = ["Root reads are not authenticated."]
next_action = ["Build the owner verified-root bundle."]

