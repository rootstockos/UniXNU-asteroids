findings = ["Touch is polled; stage 2's RPMh votes need a completion check.", "Every button constant equals sheng's (SPMI arbiter v7 at the same addresses, same PPIDs).", "TouchState.cpp's placeholder button sink is gone: ButtonProbe.cpp owns native_buttons_set_sink.", "T47 (2026-10-28): quick button clicks did not register, a slightly longer hold did: the thread reads the levels when it wakes, and a short press is up again by then. T49: with sheng-buttons-taps=1 the interrupt handler records which buttons fired, and one that is up again without a reported press is reported as a 30 ms tap; BTN taps= counts them.", "T49-gpuwait: quick taps still did not register although every edge raised an interrupt and a report (45 of 45, taps=0): the driver saw them and iOS ignored them. T50: sheng-buttons-hold-ms=<ms> delays a release until the press has lasted that long.", "T51: 4 button interrupts, 4 reports, with sheng-buttons-hold-ms=80; whether quick taps were tried is unknown."]
