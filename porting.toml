[[area]]
id = "packaging"
status = "implemented"
components = []
paths = ["patches/xnu/**", "dts/**"]
inputs = ["The payload carries the kernel, the ADT from the shared generator, the trust caches and the GPU addon; the boot image carries the phone's live DTB."]
configuration = ["[payload] size_mib = 80, panic_screen = true; the device patch series lists the fork's bring-up patches and the board CPU patches."]
procedure = ["./unixnu build payload, then ./unixnu bootimg --dtb with the live DTB."]
findings = ["Format 2 applies only the patches its series list; the fork's bring-up patches are listed in the device series with the arch: prefix."]
completion = ["The boot image boots on the phone with the expected kernel arguments."]
limits = ["The payload is built locally in the rootstock Podman machine."]
next_action = ["Build the first format 2 kernel in CI and pack it."]

[[area.evidence]]
