[[area]]
id = "gpu"
status = "implemented"
components = ["Adreno740", "AdrenoFirmware", "AdrenoPM4", "ArmSmmu4K", "Sm7635Platform", "Sm8550Platform"]
paths = ["drivers/Adreno740", "drivers/NativeAdreno", "kits/AdrenoFirmware", "package/Gpu*", "package/ShengGmu*", "package/AsteroidsMetalPlugin.mm", "package/AsteroidsGpuUserTest.cpp", "package/OriginalAcceleratorABI.h", "scripts/*gpu*", "scripts/*gmu*", "scripts/*turnip*", "scripts/*metal*", "scripts/shader_tools.py", "scripts/data/**"]
inputs = ["Adreno 810 (gen8, chip 0x44010000) at 0x3d00000 with GMU, RSCC and SMMU; firmware gen80300 from proprietary-files.txt (scripts/extract-files.py, the pinned NullDebris vendor repository)."]
configuration = ["sheng-gpu-power=19, sheng-gpu-addon=1, sheng-gpu-level=6 (763 MHz); the Metal plugin and Turnip are built on the Mac into the payload addon."]
procedure = ["Build the kernel in CI, the addon with scripts/build-asteroids-metal-plugin.py --published, pack and boot."]
findings = ["NativeAdreno's GMU headers (NativeAdrenoGmuConfig.h, NativeAdrenoGmuPlatform.h) include ShengGmu.h, so the driver compiles also take kits/Sm7635Platform (T36 run 40296339052).", "The gen8 GMU cold start and command-database parser are the SoC kit Sm7635Platform (UniXNU-sm7635-common), as sheng's are Sm8550Platform; the board keeps ShengGmuVotes.c. scripts/check-asteroids-gmu.py passes against the kit.", "The render server composites on the A810 (window server ready in 1.9 s instead of 30.8 s).", "The GPU clock does not limit the frame rate: 1050 MHz was barely faster than 763 MHz.", "T40b (2026-10-27): drivers/Adreno740 is UniXNU Adreno740 main (5c8c145) merged into our gen8 fork (rootstockos/NativeAdreno asteroids 60f16a6): ABI v2 (128 buffers per submission), no full GPU TLB flush per submission, owned and exclusive imports mapped without alias scans. The board's GPU probe keeps its ABI structures and native_adreno_publish signature; it passes no GMU AHB fence status to the ring (the new optional fence_cookie/fence_status), so WPTR writes stay unchecked as before.", "T40c (2026-10-27): sheng's GPU governor is on by default in board.toml (sheng-gpu-dcvs=1) with the 3a's range: floor level 6 (763 MHz, the former fixed level; sheng's floor 3 is 510 MHz here and held every frame in T39b), ceiling level 7 (895 MHz; no GPU thermal throttle yet). Fence waits spin (sheng-gpu-irq=0) as a board default.", "T40d (2026-10-27): IO coherence. Nothing here set native_adreno_io_coherent, so the merged driver cleaned and invalidated every imported page around every submission (T40c log: 18 s and 361 GiB of maintenance for about 3000 submissions). GpuPowerProbe now runs UniXNU-sheng's coherenceProbe (08cde20) before publishing: a kernel page mapped write-back inner-shareable, GPU reads of CPU-dirty lines and CPU reads of GPU writes both proved against DRAM; only then is it on (sheng-gpu-coherent=0 skips it). The driver keeps GPU-written imports non-coherent (myron 5bbeb3b). Turnip's 1 ms waits (pandora 6265e2d) were already fixed upstream (100 ms slices in turnip-darwin-kmd.patch); kern.maxvnodes is 66560 from upstream's iPadOS profile."]
completion = ["Core Animation renders through Metal on the GPU with measured frame times."]
limits = ["T40e: Turnip picks GMEM or system memory per pass (TU_DEBUG=nocb, as AdrenoMetal 461a842); not yet booted on the 3a. Sm8550Platform is linked as Adreno740's dependency and not used."]
next_action = ["Boot T40e and compare frame rate and GPU stalls with GMEM against T40d."]

