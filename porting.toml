schema_version = 1

[device]
name = "asteroids"
soc = "SM7635"
os_profile = "ipados-17.7.11-21H461"
summary = "Nothing Phone (3a) runs the unchanged iPad7,1 iPadOS 17.7.11 image from its UFS userdata partition, with shared SM7635 support and board-owned storage, GPU, input and power integration. Bring-up runs as numbered staged tests; their results are in docs/asteroids-gpu-gen8.md and docs/asteroids-touch.md of rootstockos/iosonandng."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "LICENSE", "scripts/make-asteroids-adt.py"]
inputs = ["SM7635 SoC profile (rootstockos/UniXNU-sm7635-common), iPadOS 17.7.11 build 21H461, asteroids_defconfig, the board's own driver forks as submodules."]
configuration = ["board.soc_source = sm7635; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "drivers/Adreno740, drivers/ShengUfs, drivers/ShengHidInput, drivers/ArmDTPlatform and kits/AdrenoFirmware are this repository's submodules at their catalog paths and take precedence over UniXNU's."]
procedure = ["Run ./unixnu status --json -D ../UniXNU-asteroids from rootstockos/UniXNU and review profiles, components and patch order."]
findings = ["Format 2 builds every selected component's kernel recipe, so [kernel] archives lists them as component: entries in the format 1 order; build-arm-driver.py skips Adreno740 and VirtioMmioBlock while their configuration switches are off, as format 1 never built them (T36 run 40297420036).", "Format 2 applies the arch, SoC and OS configuration fragments before the defconfig; bootstrap_defconfig turns off the five options common.config adds, so both passes have their format 1 configuration (checked with parse_config: no differences).", "Format 2 keeps only catalog components, so the forks of NativeAdreno and NativeUfs moved from their legacy names to drivers/Adreno740 and drivers/ShengUfs; legacy aliases are made only for UniXNU's own sources.", "T36 is the first format 2 image (build tag T36). Every board.toml value matches the format 1 board (4f05a36) except what moved to the SoC and OS profiles, the ADT tool options and the firmware pins (proprietary-files.txt); a dry-run pack caught kernel_args lost in the first rewrite.", "The ADT from the shared generator matches the former make-asteroids-adt.py output except for the OS profile's additions (J120AP first in the root compatible, product-id, /product/audio) and the arm-io window, which now covers UFS.", "T40a (2026-10-27): every fork has one working branch, asteroids (former branches are archive/* tags); drivers/ArmDTPlatform became the submodule fork rootstockos/ArmDTPlatform; the record check runs rootstockos/UniXNU's workflow and catalog, since UniXNU main's catalog does not know Sm7635Platform or QcomPmicRtc.", "T40c (2026-10-27): build tag T40; the GPU governor and fence spin are board defaults (see gpu).", "T40d (2026-10-27): sheng-lite=1 as on sheng; sheng-disable-jobs keeps only bluetoothd and coreduetd (the lite list holds the XPC wait cycle). The kernel from fork asteroids-dev 0d215db carries native-union-root-checkdirs.patch: the SystemOS union over / no longer leaves the OS root one usecount short (T40c's shutdown panic in vnode_rele_ext).", "T50: board.toml kernel_args gain sheng-dpu-scanout=2, sheng-dpu-linux=1 and sheng-audio=1."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The SoC profile is pinned to a local checkout (local.toml) until rootstockos/UniXNU-sm7635-common is published."]
next_action = ["Publish the SoC repository and pin its commit in feeds.toml."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board configuration with the SM7635 SoC and 21H461 OS profiles."

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/fetch-asteroids-gpu-firmware.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c"]
inputs = ["rootstockos/uefi-asteroids (Mu-Silicium VolcanoPkg and asteroidsPkg) with UniXNU, UniXNUDxe and DarwinBoot.", "The 3a's ABL loads the boot image with fastboot boot; it ignores the boot image's ramdisk."]
configuration = ["[bootimg] payload_in_kernel = true: the payload rides in the kernel image and ShengBootMemoryDxe finds it in the Kernel memory region."]
procedure = ["Build the payload and boot image with ./unixnu build payload and ./unixnu bootimg --dtb (the phone's live DTB), then fastboot boot the image."]
findings = ["The ABL passes the vendor_boot and init_boot ramdisks plus bootconfig as the initrd, never the boot image's own ramdisk.", "Proprietary files follow sheng's method: proprietary-files.txt with an @fetch source and SHA-256 per file, put in .cache/firmware by scripts/extract-files.py (which falls back to curl when Python has no CA store)."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Images are booted from RAM only (fastboot boot); nothing is flashed."]
next_action = ["Record the firmware revision with each boot image."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "[bootimg] and [firmware] select uefi-asteroids and the payload in the kernel image."

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "patches/xnu/**", "dts/**"]
inputs = ["Four Cortex-A520 (cpus 0-3, EPSS domain 0) and four Cortex-A720 (4-6 domain 1, 7 domain 2); EPSS domains at 17d91000/17d92000/17d93000.", "Gunyah hypervisor: SGIs are not delivered, so IPIs use armcpu-spi-ipi=1."]
configuration = ["sheng-smp=1 and armcpu-spi-ipi=1 in board.toml; unixnu,cluster-type E/P in dts/asteroids.dts; sheng-cpufreq=<mode> selects the CPU governor."]
procedure = ["Boot with sheng-cpufreq=1 and the banner on, read the CPU row (domain state and LUT), then sheng-cpufreq=4."]
findings = ["The CPU governor is sheng's CpuFreqProbe with 4/3/1 CPUs per domain and no L3 vote (the 3a has no EPSS L3).", "The E/P Edge scheduler and the idle-time helper are sheng's zzyf and zzye patches (patches/xnu).", "T40c (2026-10-27): the cpu0 park thread is off by default (sheng-cpu0-park=0, as UniXNU-sheng d361b53): the E/P Edge scheduler places work by cluster, and T39b found the park thread holding cpu0 at 100 %. The governor and the AMP and idle patches already match sheng's latest."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The governor and the E/P scheduler are not yet verified on the phone (T35)."]
next_action = ["Boot T35a (read-only) and T35b (governor) and record the clocks and frame rate."]

[[area.evidence]]
kind = "source"
reference = "package/CpuFreqProbe.cpp"
result = "EPSS CPU governor with touch boost and frame floor."

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["DRAM high bank 0x8C0000000-0xABFE00000 for the XNU window; GPU pool at 0xABFE00000 (1 GiB); GMU pool at 0xE6440000 (32 MiB); all reserved in the uefi-asteroids memory map."]
configuration = ["owned_memory_size 0x130000000 (4.75 GiB) and dram_size 0x1FFE00000; the DTS memory node equals dram_size."]
procedure = ["Check that payload.dram_size equals the DTS memory node and that DarwinBoot places the window."]
findings = ["384 MiB of owned memory left iPadOS short; 4.75 GiB in the high bank (uke's layout) is enough.", "Metal's 64 MiB blocks need a 1 GiB GPU pool outside the XNU window."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The GPU and GMU pools are fixed reservations in the firmware memory map."]
next_action = ["Record the firmware memory map with each firmware change."]

