[[area]]
id = "power"
status = "implemented"
components = ["AppleKeyStoreState"]
paths = ["package/ShengPlatformPower.cpp", "package/KeyStoreProbe.cpp", "scripts/build-asteroids-platform-power.py", "package/*Batt*", "package/BatteryProbe.cpp"]
inputs = ["sheng's placeholder ApplePMGR provider; the AppleKeyStore stand-in."]
configuration = ["sheng-pmgr=2 (required in board.toml by the payload check); sheng-aks=1 publishes the AppleKeyStore stand-in with persistent Data."]
procedure = ["Boot and check that SpringBoard finishes booting (AppleKeyStore opens)."]
findings = ["Without the AppleKeyStore stand-in on persistent Data, SpringBoard never finished booting (T20-T28).", "T38: sheng's battery manager client and iOS power source (ShengBattmgr.c, ShengBattery.cpp, sheng-battery) with the 3a's standard property numbering (temperature 12, charge counter 14, cycles 15, design 16, full 17); sheng's board fields (opcode 0x50, OEM_GET_LOG_BUFFER on the 3a) and charge current are skipped."]
completion = ["The OS boots to the desktop with the platform power and keystore services it needs."]
limits = ["No battery or charging status."]
next_action = ["Port sheng's battery manager after the ADSP start."]

